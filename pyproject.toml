[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msu-football-attendance"
version = "1.0.0"
description = "A chronological backtest of reported football attendance at Spartan Stadium."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lxml==5.3.0",
    "matplotlib==3.10.6",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "tzdata==2025.2",
]

[project.scripts]
msu-attendance = "msu_attendance.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
